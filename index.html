<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0d141c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Minsk Air Radar</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <div>
      <b>MINSK AIR RADAR</b>
      <small>Открытые ADS-B данные · тест</small>
    </div>
    <div id="status" class="status">Подключение…</div>
  </header>
  <main>
    <div id="map"></div>
    <section class="panel">
      <div class="paneltop">
        <b>Воздушная обстановка</b>
        <span id="count">— бортов</span>
      </div>
      <div id="details" class="details">Нажмите на самолёт на карте, чтобы увидеть данные.</div>
      <div class="foot">
        <span id="updated">Ожидание данных</span>
        <button id="refresh" type="button">Обновить</button>
      </div>
    </section>
  </main>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/app.js"></script>
</body>
</html>
